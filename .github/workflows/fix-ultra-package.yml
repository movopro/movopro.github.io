name: Fix Ultra package markup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ultra-package.yml'
      - 'uslugi-ceni.html'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Ultra list markup
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('uslugi-ceni.html')
          s = p.read_text(encoding='utf-8')
          bad = '''              <li>Най-силният вариант за по-големи сватби и двойки, искащи максимален обхват.\n              <li><strong>Дрон заснемане — включено в пакета.</strong></li>\n              <li><strong>Фотоалбум до 25 × 25 см — включен в пакета.</strong></li>\n              <li><strong>Следсватбена фотосесия — включена в пакета.</strong></li></li>'''
          good = '''              <li>Най-силният вариант за по-големи сватби и двойки, искащи максимален обхват.</li>\n              <li><strong>Дрон заснемане — включено в пакета.</strong></li>\n              <li><strong>Фотоалбум до 25 × 25 см — включен в пакета.</strong></li>\n              <li><strong>Следсватбена фотосесия — включена в пакета.</strong></li>'''
          if bad not in s:
              raise SystemExit('Malformed Ultra markup not found')
          p.write_text(s.replace(bad, good, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uslugi-ceni.html .github/workflows/fix-ultra-package.yml
          git rm .github/workflows/fix-ultra-package.yml
          git commit -m 'Fix Ultra package markup'
          git push
