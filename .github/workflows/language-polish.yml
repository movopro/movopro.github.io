name: Language polish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/language-polish.yml'
permissions:
  contents: write
jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize Bulgarian copy
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              'index.html', 'portfolio.html', 'videos.html',
              'uslugi-ceni.html', 'availability.html', 'about.html',
              'svatba-izbrani.html'
          ]
          replacements = {
              # Consistent formal Bulgarian address
              'Провери свободните дати за вашето събитие': 'Проверете свободните дати за вашето събитие',
              'Провери свободните дати за твоето събитие': 'Проверете свободните дати за вашето събитие',
              'Провери свободните дати и ни изпрати': 'Проверете свободните дати и ни изпратете',
              'се ориентирай бързо кои дати': 'се ориентирайте бързо кои дати',
              'Продължи към портфолиото': 'Продължете към портфолиото',
              'свържи с нас': 'свържете се с нас',
              'можеш да разгледаш Facebook страницата': 'можете да разгледате страницата ни във Facebook',
              'за да прецениш': 'за да прецените',
              'Харесва ли ти тази визия?': 'Харесва ли ви тази визия?',

              # Clearer Bulgarian wording
              'Представящо документално видео.': 'Представително документално видео.',
              'Дрон заснемане — включено в пакета.': 'Заснемане с дрон — включено в пакета.',
              'Фотограф &amp; Видеооператор · Съосновател': 'Фотограф и видеооператор · Съосновател',
              'Асистент оператор &amp; Монтажист': 'Асистент-оператор и монтажист',

              # Remove unnecessary English labels from visible copy
              'Selected Work': 'Подбрани кадри',
              'Memory Signature': 'Почеркът на Memory',
              'The Memory Philosophy': 'Философията на Memory',
              'The people behind the frames': 'Хората зад кадрите',
              'Our story': 'Нашата история',
              'Wedding Films': 'Сватбени филми',
              'Watch the story': 'Вижте историята',
              'Cinematic Wedding Stories': 'Сватбени истории',
              'Cinematic Wedding Trailer': 'Сватбен трейлър с кино визия',
              'Wedding Trailer': 'Сватбен трейлър',
              'Wedding Teaser': 'Сватбен тийзър',
              'Commercial': 'Бизнес и реклама',
              'Business Promo': 'Промо видео',
              '>Prom<': '>Балове<',
              'Prom Trailer': 'Трейлър за бал',
              'Prom trailer 2026.': 'Трейлър за бал 2026.',
              "Let's create": 'Нека създадем',

              # Bulgarian footer on every page
              'All rights reserved.': 'Всички права запазени.',
          }

          for name in files:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              old = text
              for a, b in replacements.items():
                  text = text.replace(a, b)
              if text != old:
                  p.write_text(text, encoding='utf-8')

          # Keep the visible YouTube metadata consistent in Bulgarian too.
          p = Path('videos.html')
          if p.exists():
              text = p.read_text(encoding='utf-8')
              text = text.replace('cinematic wedding trailer', 'сватбен трейлър с кино визия')
              text = text.replace('Prom trailer 2026', 'Трейлър за бал 2026')
              p.write_text(text, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html portfolio.html videos.html uslugi-ceni.html availability.html about.html svatba-izbrani.html
          git commit -m 'Polish Bulgarian copy and spelling' || true
          git rm .github/workflows/language-polish.yml || true
          git add -A
          git commit -m 'Remove language polish workflow' || true
          git push
