name: Fix hero and collage

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'movopro'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild collage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/memory-collage assets/weddings
          files=(assets/01.jpg assets/02.jpg assets/03.jpg assets/04.jpg assets/05.jpg assets/06.jpg assets/07.jpg assets/08.jpg assets/09.jpg)
          i=0
          for src in "${files[@]}"; do
            i=$((i+1))
            magick "$src" -auto-orient -resize '600x400^' -gravity center -extent 600x400 "/tmp/memory-collage/tile-$i.jpg"
          done
          magick montage /tmp/memory-collage/tile-*.jpg -tile 3x3 -geometry 600x400+5+5 -background '#0b0a08' -quality 84 assets/weddings/selected-collage.webp

      - name: Improve homepage hero composition
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- HERO-COMPOSITION-FIX -->'
          if marker not in s:
              css = '''\n  <!-- HERO-COMPOSITION-FIX -->\n  <style>\n    .home-hero{min-height:100svh!important;padding:100px 20px 64px!important;align-items:end!important;}\n    .home-hero::before{background-position:center top!important;}\n    .home-hero__inner{grid-template-columns:1fr!important;width:min(1180px,92vw)!important;gap:0!important;align-items:end!important;}\n    .home-hero__photo{display:none!important;}\n    .home-hero__copy{width:min(720px,100%)!important;margin:0 auto!important;padding:28px 30px!important;background:linear-gradient(145deg,rgba(10,9,7,.70),rgba(10,9,7,.43))!important;}\n    .home-hero h1{font-size:clamp(2.8rem,5.6vw,5.4rem)!important;max-width:10ch!important;}\n    .home-hero p{max-width:60ch!important;}\n    @media(max-width:720px){\n      .home-hero{padding:88px 14px 28px!important;}\n      .home-hero__inner{width:min(94vw,620px)!important;}\n      .home-hero__copy{padding:22px!important;}\n      .home-hero h1{font-size:clamp(2.55rem,12vw,4rem)!important;max-width:none!important;}\n    }\n  </style>\n'''
              s = s.replace('</head>', css + '</head>', 1)
              p.write_text(s, encoding='utf-8')

      - name: Ensure collage asset is committed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/weddings/selected-collage.webp
          git commit -m 'Fix homepage hero and photo collage' || true
          git push

      - name: Remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-hero-collage.yml
          git commit -m 'Remove one-shot visual fix workflow'
          git push
