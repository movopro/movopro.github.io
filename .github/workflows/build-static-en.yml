name: Build static English pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'portfolio.html'
      - 'videos.html'
      - 'uslugi-ceni.html'
      - 'availability.html'
      - 'about.html'
      - 'svatba-izbrani.html'
      - 'assets/js/language-switch*.js'
      - '.github/workflows/build-static-en.yml'

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip static en]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sanitize source pages before rendering
        shell: python
        run: |
          from pathlib import Path
          import re

          ga_block = re.compile(
              r'\s*<!-- Google tag \(gtag\.js\) -->\s*'
              r'<script async src="https://www\.googletagmanager\.com/gtag/js\?id=G-WJK01GL7PM"></script>\s*'
              r'<script>.*?gtag\([\'\"]config[\'\"],\s*[\'\"]G-WJK01GL7PM[\'\"]\);\s*</script>\s*',
              re.S,
          )

          for filename in ('uslugi-ceni.html', 'availability.html'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              cleaned, count = ga_block.subn('\n', text, count=1)
              if count == 0 and 'googletagmanager.com/gtag/js?id=G-WJK01GL7PM' in text:
                  raise SystemExit(f'Could not safely remove direct GA loader from {filename}')
              path.write_text(cleaned, encoding='utf-8')
              print(f'Cleaned direct analytics loader from {filename}: {count} block(s)')

          availability = Path('availability.html')
          text = availability.read_text(encoding='utf-8')
          text = text.replace(
              'Продължете към портфолиото или виж цените, за да избереш подходящия пакет\n              и след това се свържете се с нас за потвърждение.',
              'Продължете към портфолиото или вижте цените, за да изберете подходящия пакет,\n              а след това се свържете с нас за потвърждение.'
          )
          availability.write_text(text, encoding='utf-8')

          # Keep crawlable/no-JS pricing content aligned with the maintained calculator.
          pricing = Path('uslugi-ceni.html')
          text = pricing.read_text(encoding='utf-8')
          text = text.replace(
              'Екип от 3 души — 2 фотографи + 1 оператор или 1 фотограф + 2 оператори.',
              'Екип от 4 души — по избор: 2 фотографи + 1 оператор + 1 асистент или 1 фотограф + 2 оператори + 1 асистент.'
          )
          for stale_rate in ('от 88 € / час', 'от 99 € / час', 'от 128 € / час'):
              text = text.replace(stale_rate, '130 € първи час · 90 € всеки следващ')
          text = text.replace(
              'Ориентировъчни начални нива за различни типове ангажименти извън сватбения ден.',
              'За 1 фотограф или 1 оператор: 130 € за първия започнат час и 90 € за всеки следващ започнат час.'
          )
          pricing.write_text(text, encoding='utf-8')

      - name: Start local site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/memory-http.log 2>&1 &
          echo $! >/tmp/memory-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/index.html >/dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/memory-http.log
          exit 1

      - name: Render English pages with Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome/Chromium not found on runner.' >&2
            exit 1
          fi
          mkdir -p /tmp/memory-en-render
          pages=(index.html portfolio.html videos.html uslugi-ceni.html availability.html about.html svatba-izbrani.html)
          for page in "${pages[@]}"; do
            echo "Rendering $page"
            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --virtual-time-budget=7000 \
              --dump-dom "http://127.0.0.1:8000/${page}?lang=en" \
              > "/tmp/memory-en-render/${page}"
          done

      - name: Install HTML parser
        run: python3 -m pip install --disable-pip-version-check beautifulsoup4

      - name: Make rendered pages canonical and crawlable
        shell: python
        run: |
          from pathlib import Path
          import json
          import re
          from bs4 import BeautifulSoup

          host = 'https://memoryphotoandvideo.com'
          pages = {
              'index.html': {
                  'out': 'en/index.html', 'bg': '/', 'en': '/en/',
                  'title': 'Wedding Photographer & Videographer | Memory Photo & Video',
                  'description': 'Wedding photography and videography by Memory Photo & Video. Natural emotion, cinematic wedding films and professional coverage in Bulgaria.'
              },
              'portfolio.html': {
                  'out': 'en/portfolio.html', 'bg': '/portfolio.html', 'en': '/en/portfolio.html',
                  'title': 'Wedding Photography Portfolio | Memory Photo & Video',
                  'description': 'Explore selected wedding photography by Memory Photo & Video — natural moments, emotion, light and timeless wedding stories.'
              },
              'videos.html': {
                  'out': 'en/videos.html', 'bg': '/videos.html', 'en': '/en/videos.html',
                  'title': 'Wedding Films & Trailers | Memory Photo & Video',
                  'description': 'Watch cinematic wedding films, trailers and selected video stories created by Memory Photo & Video.'
              },
              'uslugi-ceni.html': {
                  'out': 'en/uslugi-ceni.html', 'bg': '/uslugi-ceni.html', 'en': '/en/uslugi-ceni.html',
                  'title': 'Wedding Photography & Video Pricing | Memory Photo & Video',
                  'description': 'Current wedding photography and videography packages, pricing and a flexible event cost calculator from Memory Photo & Video.'
              },
              'availability.html': {
                  'out': 'en/availability.html', 'bg': '/availability.html', 'en': '/en/availability.html',
                  'title': 'Wedding Availability Calendar | Memory Photo & Video',
                  'description': 'Check current availability for wedding photography and videography and see which dates are still open.'
              },
              'about.html': {
                  'out': 'en/about.html', 'bg': '/about.html', 'en': '/en/about.html',
                  'title': 'About Memory Photo & Video | Wedding Photo & Film Team',
                  'description': 'Meet the team behind Memory Photo & Video and learn how we approach wedding photography, videography and real emotional storytelling.'
              },
              'svatba-izbrani.html': {
                  'out': 'en/svatba-izbrani.html', 'bg': '/svatba-izbrani.html', 'en': '/en/svatba-izbrani.html',
                  'title': 'Selected Wedding Frames | Memory Photo & Video',
                  'description': 'A curated selection of wedding photographs from real celebrations captured by Memory Photo & Video.'
              },
          }

          known = {
              'index.html': '/en/',
              'portfolio.html': '/en/portfolio.html',
              'videos.html': '/en/videos.html',
              'uslugi-ceni.html': '/en/uslugi-ceni.html',
              'availability.html': '/en/availability.html',
              'about.html': '/en/about.html',
              'svatba-izbrani.html': '/en/svatba-izbrani.html',
          }

          def set_meta(soup, head, attrs, content):
              tag = head.find('meta', attrs=attrs)
              if not tag:
                  tag = soup.new_tag('meta')
                  for key, value in attrs.items():
                      tag[key] = value
                  head.append(tag)
              tag['content'] = content

          Path('en').mkdir(exist_ok=True)
          for src, cfg in pages.items():
              raw = Path('/tmp/memory-en-render', src).read_text(encoding='utf-8')
              soup = BeautifulSoup(raw, 'html.parser')
              if soup.html:
                  soup.html['lang'] = 'en'

              head = soup.head
              if not head:
                  raise SystemExit(f'Missing <head> after rendering {src}')

              # Do not persist browser/runtime analytics state in the static English HTML.
              # main.js owns consent and loads GA only after the visitor accepts.
              for script in list(soup.find_all('script')):
                  script_src = script.get('src', '') or ''
                  script_text = script.get_text(' ', strip=True)
                  if 'googletagmanager.com/gtag/js' in script_src:
                      script.decompose()
                      continue
                  if 'G-WJK01GL7PM' in script_text and ('gtag(' in script_text or 'dataLayer' in script_text):
                      script.decompose()

              for tag in head.find_all('base'):
                  tag.decompose()
              base = soup.new_tag('base', href='/')
              head.insert(0, base)

              title = head.find('title')
              if title:
                  title.string = cfg['title']
              else:
                  title = soup.new_tag('title')
                  title.string = cfg['title']
                  head.append(title)

              desc = head.find('meta', attrs={'name': re.compile(r'^description$', re.I)})
              if not desc:
                  desc = soup.new_tag('meta')
                  desc['name'] = 'description'
                  head.append(desc)
              desc['content'] = cfg['description']

              # Keep share previews aligned with the English canonical page.
              set_meta(soup, head, {'property': 'og:locale'}, 'en_US')
              set_meta(soup, head, {'property': 'og:title'}, cfg['title'])
              set_meta(soup, head, {'property': 'og:description'}, cfg['description'])
              set_meta(soup, head, {'property': 'og:url'}, host + cfg['en'])
              set_meta(soup, head, {'name': 'twitter:title'}, cfg['title'])
              set_meta(soup, head, {'name': 'twitter:description'}, cfg['description'])

              for tag in head.find_all('link', attrs={'rel': lambda v: v and 'canonical' in v}):
                  tag.decompose()
              canonical = soup.new_tag('link', rel='canonical', href=host + cfg['en'])
              head.append(canonical)

              for tag in head.find_all('link', attrs={'hreflang': True}):
                  tag.decompose()
              for lang, path in [('bg', cfg['bg']), ('en', cfg['en']), ('x-default', cfg['bg'])]:
                  alt = soup.new_tag('link', rel='alternate', hreflang=lang, href=host + path)
                  head.append(alt)

              for meta in head.find_all('meta', attrs={'http-equiv': re.compile(r'^refresh$', re.I)}):
                  meta.decompose()

              # Replace every Bulgarian structured-data snapshot with English structured data.
              for schema in soup.find_all('script', attrs={'type': 'application/ld+json'}):
                  schema.decompose()
              page_type = 'AboutPage' if src == 'about.html' else 'WebPage'
              schema = soup.new_tag('script', id='mpv-seo-schema', type='application/ld+json')
              schema.string = json.dumps({
                  '@context': 'https://schema.org',
                  '@graph': [
                      {
                          '@type': 'ProfessionalService',
                          '@id': host + '/#business',
                          'name': 'Memory Photo & Video',
                          'url': host + '/',
                          'logo': host + '/logo.png',
                          'image': host + '/memory-og-2026.jpg',
                          'description': 'Wedding photography and videography in Bulgaria.',
                          'foundingDate': '2017',
                          'areaServed': {'@type': 'Country', 'name': 'Bulgaria'},
                          'serviceType': ['Wedding photography', 'Wedding videography', 'Event photography', 'Event videography'],
                          'sameAs': ['https://www.instagram.com/memoryphotoandvideo/', 'https://www.facebook.com/MemoryPhotoAndVideo/']
                      },
                      {
                          '@type': 'WebSite',
                          '@id': host + '/#website-en',
                          'url': host + '/en/',
                          'name': 'Memory Photo & Video',
                          'inLanguage': 'en',
                          'publisher': {'@id': host + '/#business'}
                      },
                      {
                          '@type': page_type,
                          '@id': host + cfg['en'] + '#webpage',
                          'url': host + cfg['en'],
                          'name': cfg['title'],
                          'description': cfg['description'],
                          'isPartOf': {'@id': host + '/#website-en'},
                          'about': {'@id': host + '/#business'},
                          'inLanguage': 'en'
                      }
                  ]
              }, ensure_ascii=False, separators=(',', ':'))
              head.append(schema)

              # Keep English users inside the English section. The language-switch control
              # itself is intentionally excluded so it continues to return to Bulgarian.
              for a in soup.find_all('a', href=True):
                  if 'language-switch' in (a.get('class') or []):
                      continue
                  href = a.get('href', '')
                  if href.startswith(('http://', 'https://', 'mailto:', 'tel:', '#', 'javascript:')):
                      continue
                  clean = href.split('#', 1)[0].split('?', 1)[0].lstrip('/')
                  anchor = ('#' + href.split('#', 1)[1]) if '#' in href else ''
                  if clean in known:
                      a['href'] = known[clean] + anchor
                  elif clean == '':
                      a['href'] = '/en/' + anchor

              # Fix English accessibility labels that are not visible-text translations.
              nav = soup.find('nav')
              if nav:
                  nav['aria-label'] = 'Primary navigation'
              menu_toggle = soup.find(id='menuToggle')
              if menu_toggle:
                  menu_toggle['aria-label'] = 'Open menu'
              burger = soup.select_one('label.burger')
              if burger:
                  burger['aria-label'] = 'Menu'
              for social in soup.select('.home-socials'):
                  social['aria-label'] = 'Social media'
              for link in soup.find_all('a', href=True):
                  href = link.get('href', '')
                  if 'instagram.com/memoryphotoandvideo' in href:
                      link['aria-label'] = 'Memory Photo & Video on Instagram'
                  elif 'facebook.com/MemoryPhotoAndVideo' in href:
                      link['aria-label'] = 'Memory Photo & Video on Facebook'

              # Remove browser-only/runtime controls; scripts recreate them cleanly.
              for transient in soup.select('#wowScrollProgress, .language-switch, .wow-scroll-cue, .mpv-consent, .portfolio-gallery-controls'):
                  transient.decompose()
              for item in soup.select('.gallery-item[hidden]'):
                  del item['hidden']
              # language-switch.js injects these at runtime; snapshot copies would load them twice.
              for script in list(soup.find_all('script', src=True)):
                  if re.search(r'language-switch-(runtime|complete)\.js|wow-polish\.js', script['src']):
                      script.decompose()
              # Reset the homepage slider to its initial state. The snapshot is taken after
              # autoplay has advanced, and a stale data-slider-ready stops main.js initialising it.
              for slider in soup.select('[data-home-slider]'):
                  if slider.has_attr('data-slider-ready'):
                      del slider['data-slider-ready']
                  for index, slide in enumerate(slider.select('[data-home-slide]')):
                      classes = [c for c in slide.get('class', []) if c != 'is-active']
                      slide['class'] = classes + (['is-active'] if index == 0 else [])
                      slide['aria-hidden'] = 'false' if index == 0 else 'true'
                  for index, dot in enumerate(slider.select('[data-home-slide-to]')):
                      classes = [c for c in dot.get('class', []) if c != 'is-active']
                      dot['class'] = classes + (['is-active'] if index == 0 else [])
                      if index == 0:
                          dot['aria-current'] = 'true'
                      elif dot.has_attr('aria-current'):
                          del dot['aria-current']
                  status = slider.select_one('[data-home-slider-status]')
                  if status:
                      status.string = f"Photo 1 of {len(slider.select('[data-home-slide]'))}"

              # Keep inactive homepage slides deferred (main.js loads them after the page).
              pixel = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'
              for slide in soup.select('[data-home-slide]:not(.is-active)'):
                  for source in slide.find_all('source', srcset=True):
                      if not source['srcset'].startswith('data:'):
                          source['data-srcset'], source['srcset'] = source['srcset'], pixel
                  for img in slide.find_all('img', src=True):
                      if not img['src'].startswith('data:'):
                          img['data-src'], img['src'] = img['src'], pixel
              # <base href="/"> makes bare "#fragment" links resolve to the Bulgarian homepage.
              for a in soup.find_all('a', href=True):
                  if a['href'].startswith('#') and len(a['href']) > 1:
                      a['href'] = cfg['en'] + a['href']

              out = Path(cfg['out'])
              out.write_text(str(soup), encoding='utf-8')
              print(f'Wrote {out}')

      - name: Validate generated English pages
        shell: bash
        run: |
          set -euo pipefail
          for f in en/index.html en/portfolio.html en/videos.html en/uslugi-ceni.html en/availability.html en/about.html en/svatba-izbrani.html; do
            grep -q '<h1' "$f" || { echo "Missing H1 in $f"; exit 1; }
            grep -q 'rel="canonical"' "$f" || { echo "Missing canonical in $f"; exit 1; }
            grep -q 'hreflang="en"' "$f" || { echo "Missing hreflang in $f"; exit 1; }
            grep -q 'content="en_US" property="og:locale"\|property="og:locale" content="en_US"' "$f" || { echo "Missing English OG locale in $f"; exit 1; }
            grep -q 'id="mpv-seo-schema"' "$f" || { echo "Missing English schema in $f"; exit 1; }
            if grep -qi 'http-equiv="refresh"' "$f"; then echo "Refresh redirect still present in $f"; exit 1; fi
            if grep -q 'googletagmanager.com/gtag/js' "$f"; then echo "Direct GA loader leaked into $f"; exit 1; fi
            if grep -q 'mpv-consent' "$f"; then echo "Static consent dialog leaked into $f"; exit 1; fi
          done
          for f in uslugi-ceni.html availability.html; do
            if grep -q 'googletagmanager.com/gtag/js?id=G-WJK01GL7PM' "$f"; then echo "Direct GA loader still present in $f"; exit 1; fi
          done
          grep -q 'Екип от 4 души — по избор:' uslugi-ceni.html || { echo 'Premium static content is stale'; exit 1; }
          if grep -q 'от 88 € / час\|от 99 € / час\|от 128 € / час' uslugi-ceni.html; then echo 'Stale event rates remain'; exit 1; fi

      - name: Commit sanitized sources and generated English pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add availability.html uslugi-ceni.html en/index.html en/portfolio.html en/videos.html en/uslugi-ceni.html en/availability.html en/about.html en/svatba-izbrani.html
          if git diff --cached --quiet; then
            echo 'Source and English pages already up to date.'
            exit 0
          fi
          git commit -m "Normalize pricing content and regenerate English pages [skip static en]"
          git push
