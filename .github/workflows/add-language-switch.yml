name: Add language switch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    if: "!contains(github.event.head_commit.message, '[skip language switch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject switch and normalize HTML
        shell: python
        run: |
          from pathlib import Path
          files = list(Path('.').glob('*.html')) + list(Path('en').glob('*.html'))
          for p in files:
              text = p.read_text(encoding='utf-8')
              css = 'assets/css/language-switch.css' if p.parent.name != 'en' else '../assets/css/language-switch.css'
              js = 'assets/js/language-switch.js' if p.parent.name != 'en' else '../assets/js/language-switch.js'

              # IMPORTANT: preserve JavaScript escaped newlines (\\n).
              # Converting them into real newlines inside JS string literals
              # creates SyntaxError: Invalid or unexpected token.
              if 'language-switch.css' not in text:
                  text = text.replace('</head>', f'<link rel="stylesheet" href="{css}">\n</head>', 1)
              if 'language-switch.js' not in text:
                  text = text.replace('</body>', f'<script defer src="{js}"></script>\n</body>', 1)
              p.write_text(text, encoding='utf-8')

      - name: Validate JavaScript blocks
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for p in list(Path('.').glob('*.html')) + list(Path('en').glob('*.html')):
              text=p.read_text(encoding='utf-8')
              for i,code in enumerate(re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>', text, re.S),1):
                  if not code.strip():
                      continue
                  f=Path(tempfile.gettempdir())/f'memory-inline-{i}.js'
                  f.write_text(code,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if r.returncode:
                      raise SystemExit(f'JavaScript syntax error in {p}, inline script {i}:\n{r.stderr}')
          print('All inline JavaScript blocks passed syntax validation.')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' 'en/*.html' 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Normalize HTML JavaScript safely [skip language switch]"
          git push
