name: Ultra package update
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ultra-package-update.yml'
      - 'uslugi-ceni.html'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Ultra extras
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('uslugi-ceni.html')
          s = p.read_text(encoding='utf-8')
          marker = 'Дрон заснемане — включено в пакета.'
          if marker not in s:
              target = 'Най-силният вариант за по-големи сватби и двойки, искащи максимален обхват.'
              replacement = target + '''\n              <li><strong>Дрон заснемане — включено в пакета.</strong></li>\n              <li><strong>Фотоалбум до 25 × 25 см — включен в пакета.</strong></li>\n              <li><strong>Следсватбена фотосесия — включена в пакета.</strong></li>'''
              if target not in s:
                  raise SystemExit('Ultra package target not found')
              s = s.replace(target, replacement, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uslugi-ceni.html .github/workflows/ultra-package-update.yml
          git rm .github/workflows/ultra-package-update.yml
          git commit -m 'Add Ultra package inclusions'
          git push
