name: Fix navigation label
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor == 'movopro'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize navigation label
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              s2 = s.replace('>Ценоразпис</a>', '>Цени</a>')
              if s2 != s:
                  p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit navigation fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git commit -m 'Use consistent Цени navigation label' || true
          git push
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/fix-nav-label.yml
          git commit -m 'Remove one-shot navigation fix workflow'
          git push
