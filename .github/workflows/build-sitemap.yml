name: Build SEO sitemap

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'svatben-fotograf-kardzhali.html'
      - 'svatben-fotograf-plovdiv.html'
      - 'portfolio.html'
      - 'videos.html'
      - 'uslugi-ceni.html'
      - 'availability.html'
      - 'about.html'
      - 'svatba-izbrani.html'
      - 'weddings/*.html'
      - 'en/*.html'
      - 'scripts/build_sitemap.py'
      - 'scripts/validate_seo.py'
      - 'header.html'
      - 'sitemap.xml'
      - '.github/workflows/build-sitemap.yml'

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip sitemap]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate sitemap
        run: python3 scripts/build_sitemap.py

      - name: Validate sitemap
        run: python3 scripts/validate_seo.py

      - name: Commit sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo 'Sitemap already up to date.'
            exit 0
          fi
          git commit -m "Refresh sitemap and image discovery [skip sitemap]"
          git fetch origin main
          git rebase origin/main
          git push
