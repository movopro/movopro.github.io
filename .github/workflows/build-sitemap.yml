name: Build SEO sitemap

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'svatben-fotograf-kardzhali.html'
      - 'svatben-fotograf-plovdiv.html'
      - 'portfolio.html'
      - 'videos.html'
      - 'uslugi-ceni.html'
      - 'availability.html'
      - 'about.html'
      - 'svatba-izbrani.html'
      - 'weddings/*.html'
      - 'en/*.html'
      - 'scripts/build_sitemap.py'
      - '.github/workflows/build-sitemap.yml'

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip sitemap]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate sitemap
        run: python3 scripts/build_sitemap.py

      - name: Validate sitemap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          host = 'https://memoryphotoandvideo.com'
          tree = ET.parse('sitemap.xml')
          root = tree.getroot()
          ns = '{http://www.sitemaps.org/schemas/sitemap/0.9}'
          urls = root.findall(f'{ns}url')
          locs = {u.find(f'{ns}loc').text for u in urls}

          expected_weddings = {
              host + '/' + p.as_posix()
              for p in Path('weddings').glob('*.html')
          }
          expected_pages = {
              host + '/',
              host + '/svatben-fotograf-kardzhali.html',
              host + '/svatben-fotograf-plovdiv.html',
          }
          missing = sorted((expected_weddings | expected_pages) - locs)
          if missing:
              raise SystemExit('Expected URLs missing from sitemap: ' + ', '.join(missing))
          if len(urls) < 16 + len(expected_weddings):
              raise SystemExit(f'Expected at least {16 + len(expected_weddings)} page URLs, found {len(urls)}')
          print(f'Validated sitemap with {len(urls)} page URLs including {len(expected_weddings)} wedding watch pages.')
          PY

      - name: Commit sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo 'Sitemap already up to date.'
            exit 0
          fi
          git commit -m "Refresh sitemap and image discovery [skip sitemap]"
          git fetch origin main
          git rebase origin/main
          git push
