<!DOCTYPE html>
<html lang="bg">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Свободни дати | Memory Photo & Video</title>
<link rel="icon" type="image/png" href="logo.png" />

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet" />

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --cream:#f5f0e8;
  --dark:#0f0d0b;
  --gold:#c9a96e;
  --gold-light:#e8d5b0;
  --nav:#1e5c86;
}

body{
  font-family:'Montserrat',sans-serif;
  background:var(--dark);
  color:var(--cream);
  min-height: 100vh;
}

/* ===== TOP NAV (като index) ===== */
header{
  position: fixed;
  top: 0; left: 0; right: 0;
  background: var(--nav);
  z-index: 50;
  box-shadow: 0 8px 24px rgba(0,0,0,.25);
}

.nav-wrap{
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  gap: 14px;
  flex-wrap: wrap;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  text-decoration:none;
  color: var(--cream);
}

.brand img{
  width: 34px;
  height: 34px;
  border-radius: 10px;
  object-fit: cover;
  border: 1px solid rgba(255,255,255,.18);
  background: rgba(0,0,0,.10);
}

.brand span{
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  letter-spacing: .10em;
  font-size: 1.05rem;
  white-space: nowrap;
  opacity: .95;
}

/* Mobile menu toggle */
#menuToggle{display:none}

.burger{
  display:none;
  width:44px; height:44px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:12px;
  background:rgba(0,0,0,.12);
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.burger div{
  width:18px; height:2px;
  background:rgba(245,240,232,.92);
  position:relative;
}
.burger div::before,.burger div::after{
  content:"";
  position:absolute; left:0;
  width:18px; height:2px;
  background:rgba(245,240,232,.92);
}
.burger div::before{top:-6px}
.burger div::after{top:6px}

nav{
  display:flex;
  gap:18px;
  align-items:center;
  flex-wrap:wrap;
}

nav a{
  color: rgba(245,240,232,.92);
  text-decoration:none;
  font-size: .80rem;
  letter-spacing: .16em;
  text-transform: uppercase;
  padding: 10px 10px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0);
  transition: .15s ease;
}
nav a:hover{
  background: rgba(0,0,0,.14);
  border-color: rgba(255,255,255,.12);
}
.nav-cta{
  border: 1px solid rgba(201,169,110,.55) !important;
  background: rgba(0,0,0,.10);
}

@media (max-width: 880px){
  .burger{display:flex}
  nav{
    display:none;
    width:100%;
    padding: 12px 0 4px;
    gap: 8px;
  }
  #menuToggle:checked ~ nav{display:flex}
  nav a{width:100%; text-align:left; padding:12px 12px}
}

/* ===== SECTION ===== */
.section{
  padding: 110px 20px 100px;
}
.wrap{
  max-width:1000px;
  margin:0 auto;
  overflow-x: hidden;
}
.title{
  font-family:'Cormorant Garamond',serif;
  font-size:2.3rem;
  letter-spacing:.08em;
  margin-bottom:16px;
  color:var(--gold-light);
}
.subtitle{
  opacity:.85;
  margin-bottom:30px;
  line-height:1.6;
}

/* ===== CALENDAR ===== */
.card{
  border-radius:22px;
  border:1px solid rgba(201,169,110,.25);
  background:rgba(255,255,255,.02);
  backdrop-filter:blur(8px);
  padding:30px;
  box-shadow:0 25px 60px rgba(0,0,0,.45);
  max-width: 100%;
}

.cal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  gap: 10px;
}
.cal-month{
  font-family:'Cormorant Garamond',serif;
  font-size:1.4rem;
  letter-spacing:.1em;
  color:var(--gold-light);
  text-align: center;
  flex: 1;
}
.cal-btn{
  width:44px;
  height:44px;
  border-radius:14px;
  border:1px solid rgba(201,169,110,.4);
  background:rgba(0,0,0,.2);
  color:var(--gold-light);
  font-size:20px;
  cursor:pointer;
  transition:.2s;
}
.cal-btn:hover{
  background:rgba(201,169,110,.15);
}

.year-switch{
  display:flex;
  justify-content:center;
  margin:22px 0 8px;
}

.year-toggle{
  position:relative;
  display:inline-flex;
  align-items:center;
  gap:12px;
  padding:14px 22px;
  border-radius:999px;
  border:1px solid rgba(201,169,110,.45);
  background:linear-gradient(135deg, rgba(201,169,110,.18), rgba(30,92,134,.16));
  color:var(--cream);
  letter-spacing:.16em;
  text-transform:uppercase;
  font-size:.78rem;
  cursor:pointer;
  overflow:hidden;
  box-shadow:0 14px 34px rgba(0,0,0,.28);
  transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;
}

.year-toggle::before{
  content:"";
  position:absolute;
  inset:1px;
  border-radius:inherit;
  background:linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.02));
  opacity:.9;
  pointer-events:none;
}

.year-toggle::after{
  content:"";
  position:absolute;
  inset:-30% auto -30% -20%;
  width:90px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.28), transparent);
  transform:skewX(-20deg);
  transition:transform .7s ease;
  pointer-events:none;
}

.year-toggle:hover,
.year-toggle:focus-visible{
  transform:translateY(-2px) scale(1.01);
  box-shadow:0 18px 40px rgba(0,0,0,.34), 0 0 0 6px rgba(201,169,110,.06);
  border-color:rgba(232,213,176,.72);
}

.year-toggle:hover::after,
.year-toggle:focus-visible::after{
  transform:translateX(240px) skewX(-20deg);
}

.year-toggle-text,
.year-toggle-badge{
  position:relative;
  z-index:1;
}

.year-toggle-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:56px;
  height:34px;
  padding:0 14px;
  border-radius:999px;
  background:rgba(15,13,11,.34);
  border:1px solid rgba(255,255,255,.1);
  font-weight:600;
  letter-spacing:.12em;
  color:var(--gold-light);
}

.year-toggle[data-target-year="2027"] .year-toggle-text::before{
  content:"Отвори";
}

.year-toggle[data-target-year="2026"] .year-toggle-text::before{
  content:"Назад към";
}

.grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:10px;
  max-width: 100%;
}

/* Клетки */
.cell{
  padding:12px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.10);
  min-height:55px;
  display:flex;
  align-items:flex-start;
  justify-content:flex-start;
  font-weight:600;
}

/* Заглавки Пн-Нд */
.dow{
  text-align:center;
  justify-content:center;
  font-size:.75rem;
  letter-spacing:.12em;
  opacity:.75;
  background: rgba(0,0,0,.22);
  border-color: rgba(201,169,110,.18);
  font-weight:500;
}

/* Празни клетки */
.empty{
  background: rgba(0,0,0,.12);
  border-color: rgba(255,255,255,.06);
  opacity:.25;
}

/* Свободно = зелено */
.free{
  background: rgba(0, 180, 90, .18);
  border-color: rgba(0, 180, 90, .55);
}

/* Заето = червено */
.busy{
  background: rgba(220, 45, 45, .20);
  border-color: rgba(220, 45, 45, .65);
  position:relative;
}

/* Само фотограф = оранжево */
.partial{
  background: rgba(255, 140, 0, .20);
  border-color: rgba(255, 140, 0, .72);
}

/* Специално маркирани дати */
.featured{
  position:relative;
  background:linear-gradient(135deg, rgba(201,169,110,.30), rgba(201,169,110,.14));
  border-color:rgba(232,213,176,.92);
  box-shadow:0 0 0 1px rgba(201,169,110,.24), 0 10px 24px rgba(201,169,110,.18);
}

.featured::before{
  content:"★";
  position:absolute;
  top:6px;
  right:8px;
  font-size:.72rem;
  color:var(--gold-light);
  opacity:.95;
}

.featured::after{
  content:attr(data-note);
  position:absolute;
  left:50%;
  bottom:calc(100% + 8px);
  transform:translateX(-50%) translateY(6px);
  background:rgba(15,13,11,.96);
  color:var(--gold-light);
  border:1px solid rgba(201,169,110,.45);
  border-radius:12px;
  padding:8px 10px;
  font-size:.68rem;
  line-height:1.3;
  white-space:nowrap;
  box-shadow:0 14px 30px rgba(0,0,0,.38);
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease, transform .18s ease;
  z-index:4;
}

.featured:hover::after,
.featured:focus-visible::after{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* Легенда */
.legend{
  margin-top:18px;
  font-size:.85rem;
  opacity:.90;
  display:flex;
  gap:16px;
  flex-wrap:wrap;
}
.legend-item{
  display:flex;
  align-items:center;
  gap:8px;
}
.dot{
  width:10px;height:10px;border-radius:999px;display:inline-block;
}
.dot-free{ background: rgba(0, 180, 90, .9); }
.dot-busy{ background: rgba(220, 45, 45, .95); }
.dot-partial{ background: rgba(255, 140, 0, .95); }
.dot-featured{ background: rgba(201,169,110,.95); box-shadow:0 0 0 3px rgba(201,169,110,.18); }

/* ===== FOOTER ===== */
footer{
  background:#000;
  padding:30px 20px;
  text-align:center;
  font-size:.75rem;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:rgba(245,240,232,.6);
  border-top:1px solid rgba(201,169,110,.2);
}

/* ===== MOBILE FIX: calendar overflow ===== */
@media (max-width: 520px){
  .section{ padding: 110px 14px 80px; }
  .card{ padding: 16px; border-radius: 18px; }
  .grid{ gap: 6px; }

  .cell{
    padding: 8px;
    min-height: 42px;
    border-radius: 12px;
    font-size: 0.85rem;
  }

  .dow{
    font-size: 0.65rem;
    letter-spacing: .08em;
  }

  .cal-month{ font-size: 1.15rem; }
  .cal-btn{
    width: 40px; height: 40px;
    border-radius: 12px;
  }

  .year-toggle{
    width:100%;
    justify-content:center;
    padding:13px 16px;
    letter-spacing:.12em;
  }

  .year-toggle-badge{
    min-width:52px;
    height:32px;
    padding:0 12px;
  }

  .featured::after{
    white-space:normal;
    width:min(220px, calc(100vw - 56px));
    text-align:center;
  }
}

@media (max-width: 360px){
  .grid{ gap: 5px; }
  .cell{ padding: 7px; min-height: 40px; font-size: 0.8rem; }
}
</style>
</head>

<body>
<header>
  <div class="nav-wrap">
    <a class="brand" href="index.html" aria-label="Начало">
      <img src="icon.png" alt="Икона">
      <span>Memory Photo &amp; Video</span>
    </a>

    <input id="menuToggle" type="checkbox" />
    <label class="burger" for="menuToggle" aria-label="Меню"><div></div></label>

    <nav>
      <a href="index.html">Начало</a>
      <a href="portfolio.html">Портфолио</a>
      <a href="uslugi-ceni.html">Ценоразпис</a>
      <a href="availability.html" class="nav-cta">Свободни дати</a>
      <a href="about.html">За нас</a>
    </nav>
  </div>
</header>

<section class="section">
  <div class="wrap">
    <h2 class="title">Свободни дати</h2>
    <p class="subtitle">
      Червените дати са напълно заети. Зелените са свободни. Оранжевите означават, че е наличен само фотограф.
    </p>

    <div class="card">
      <div class="cal-header">
        <button class="cal-btn" id="prev" type="button" aria-label="Предишен месец">‹</button>
        <div class="cal-month" id="monthLabel"></div>
        <button class="cal-btn" id="next" type="button" aria-label="Следващ месец">›</button>
      </div>

      <div class="grid" id="grid"></div>

      <div class="year-switch">
        <button class="year-toggle" id="yearToggle" type="button" data-target-year="2027" aria-label="Отвори календара за 2027">
          <span class="year-toggle-text"></span>
          <span class="year-toggle-badge">2027</span>
        </button>
      </div>

      <div class="legend">
        <span class="legend-item"><i class="dot dot-free"></i> Свободно</span>
        <span class="legend-item"><i class="dot dot-partial"></i> Само фотограф</span>
        <span class="legend-item"><i class="dot dot-busy"></i> Заето</span>
        <span class="legend-item"><i class="dot dot-featured"></i> Специално отбелязани дати</span>
      </div>
    </div>
  </div>
</section>

<footer>
  © 2026 Memory Photo & Video. All rights reserved.
</footer>

<script>
(function(){
  const calendarData = {
    2026: {
      busy: new Set([
        "2026-03-14",
        "2026-04-18",
        "2026-04-25",
        "2026-05-16",
        "2026-05-24",
        "2026-05-25",
        "2026-05-26",
        "2026-05-28",
        "2026-05-30",
        "2026-06-06",
        "2026-06-14",
        "2026-06-20",
        "2026-06-26",
        "2026-06-27",
        "2026-07-18",
        "2026-07-28",
        "2026-07-30",
        "2026-08-08",
        "2026-08-15",
        "2026-08-23",
        "2026-09-26",
        "2026-10-10"
      ]),
      partial: new Set([
        "2026-06-13",
        "2026-07-10",
        "2026-07-11",
        "2026-07-12",
        "2026-07-14",
        "2026-07-19",
        "2026-07-24",
        "2026-07-25",
        "2026-08-16",
        "2026-08-29",
        "2026-09-12",
        "2026-09-13",
        "2026-10-04"
      ]),
      featured: {},
      minView: new Date(2026, 2, 1),
      maxView: new Date(2026, 9, 1)
    },
    2027: {
      busy: new Set([
        "2027-07-17",
        "2027-08-21"
      ]),
      partial: new Set([]),
      featured: {
        "2027-07-17": "17.07.2027",
        "2027-08-21": "21.08.2027"
      },
      minView: new Date(2027, 0, 1),
      maxView: new Date(2027, 11, 1)
    }
  };

  const monthNames = ["Януари","Февруари","Март","Април","Май","Юни","Юли","Август","Септември","Октомври","Ноември","Декември"];
  const dow = ["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];

  const grid = document.getElementById("grid");
  const label = document.getElementById("monthLabel");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");
  const yearToggle = document.getElementById("yearToggle");

  if(!grid || !label || !prev || !next || !yearToggle) return;

  let activeYear = 2026;
  let view = new Date(calendarData[activeYear].minView.getFullYear(), calendarData[activeYear].minView.getMonth(), 1);

  function pad(n){ return String(n).padStart(2,"0"); }
  function fmt(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }

  function getConfig(){
    return calendarData[activeYear];
  }

  function clampView(){
    const { minView, maxView } = getConfig();
    if(view < minView) view = new Date(minView.getFullYear(), minView.getMonth(), 1);
    if(view > maxView) view = new Date(maxView.getFullYear(), maxView.getMonth(), 1);
  }

  function updateButtons(){
    const { minView, maxView } = getConfig();
    const atMin = (view.getFullYear() === minView.getFullYear() && view.getMonth() === minView.getMonth());
    const atMax = (view.getFullYear() === maxView.getFullYear() && view.getMonth() === maxView.getMonth());

    prev.disabled = atMin;
    next.disabled = atMax;

    prev.style.opacity = atMin ? ".35" : "1";
    next.style.opacity = atMax ? ".35" : "1";
    prev.style.cursor = atMin ? "not-allowed" : "pointer";
    next.style.cursor = atMax ? "not-allowed" : "pointer";

    const nextYear = activeYear === 2026 ? 2027 : 2026;
    yearToggle.dataset.targetYear = String(nextYear);
    yearToggle.setAttribute("aria-label", (activeYear === 2026 ? "Отвори календара за " : "Назад към календара за ") + nextYear);
    yearToggle.querySelector(".year-toggle-badge").textContent = nextYear;
  }

  function render(){
    clampView();
    grid.innerHTML="";

    dow.forEach(d=>{
      const el=document.createElement("div");
      el.className="cell dow";
      el.textContent=d;
      grid.appendChild(el);
    });

    const y=view.getFullYear();
    const m=view.getMonth();
    label.textContent=monthNames[m]+" "+y;

    const first=new Date(y,m,1);
    const last=new Date(y,m+1,0);
    const offset=(first.getDay()+6)%7;
    const { busy, partial, featured } = getConfig();

    for(let i=0;i<offset;i++){
      const e=document.createElement("div");
      e.className="cell empty";
      grid.appendChild(e);
    }

    for(let d=1; d<=last.getDate(); d++){
      const date=new Date(y,m,d);
      const key=fmt(date);

      const e=document.createElement("div");
      const isBusy = busy.has(key);
      const isPartial = partial.has(key);
      const isFeatured = Object.prototype.hasOwnProperty.call(featured, key);

      e.className = "cell " + (isBusy ? "busy" : (isPartial ? "partial" : "free"));
      if(isFeatured){
        e.classList.add("featured");
        e.setAttribute("data-note", featured[key]);
        e.setAttribute("tabindex", "0");
        e.setAttribute("aria-label", "Отбелязана дата " + featured[key]);
      }
      e.textContent = d;

      grid.appendChild(e);
    }

    updateButtons();
  }

  function setYear(year){
    activeYear = year;
    view = new Date(calendarData[activeYear].minView.getFullYear(), calendarData[activeYear].minView.getMonth(), 1);
    render();
  }

  prev.onclick=()=>{
    if(prev.disabled) return;
    view=new Date(view.getFullYear(), view.getMonth()-1, 1);
    render();
  };

  next.onclick=()=>{
    if(next.disabled) return;
    view=new Date(view.getFullYear(), view.getMonth()+1, 1);
    render();
  };

  yearToggle.onclick=()=>{
    setYear(activeYear === 2026 ? 2027 : 2026);
  };

  render();
})();
</script>

</body>
</html>
